name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrappers executable
        run: chmod +x gradlew

      - name: Checkout cap4k 1.0.0 candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/cap4k-1.0.0-verification'
        uses: actions/checkout@v4
        with:
          repository: LDmoxeii/cap4k
          ref: verify/maven-central-v1.0.0
          path: .cap4k-candidate

      - name: Check reference project with cap4k candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/cap4k-1.0.0-verification'
        run: ./gradlew --include-build .cap4k-candidate check

      - name: Check reference project
        if: github.event_name != 'pull_request' || github.head_ref != 'chore/cap4k-1.0.0-verification'
        run: ./gradlew check
